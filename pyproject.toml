[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mddex"
version = "0.3.0"
description = "Which file should you read? Offline BM25 router over markdown doc trees."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mddex = "mddex.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
